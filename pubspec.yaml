name: simple_dictation
description: 简易听写 APP - 本地词单管理 + TTS 语音听写
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_tts: ^4.0.2
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0
  fast_gbk: ^1.0.0
  # 前台服务 + 唤醒锁：锁屏/黑屏时保持 CPU 运行，TTS 能继续自动播报下一条
  # 锁定 8.x 系列（compileSdk 34/Kotlin 1.7.10 即可），避免 9+ 对 Gradle/Kotlin 的高要求
  flutter_foreground_task: ^8.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/ding.wav
