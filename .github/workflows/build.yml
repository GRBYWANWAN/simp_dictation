name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        run: flutter pub get

      - name: 补全 Android 工程文件（如缺失）
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=simple_dictation
          fi

      - name: 代码静态分析
        run: flutter analyze

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 重命名 APK（带版本号）
        run: |
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          NEW_NAME="simple_dictation_v${VERSION}_$(date +%Y%m%d).apk"
          cp "$APK_PATH" "build/app/outputs/flutter-apk/$NEW_NAME"
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: simple-dictation-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
