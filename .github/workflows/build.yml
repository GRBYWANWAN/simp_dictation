name: Build Android APK

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter SDK（最新稳定版）
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 打印 Flutter 版本和诊断
        run: |
          flutter --version
          flutter doctor -v

      - name: 安装依赖
        run: flutter pub get

      - name: 生成标准 Android 工程
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=simple_dictation
          # 删除自动生成的测试文件
          rm -rf test
          # flutter_tts 要求 minSdk 24；file_picker 要求 compileSdk 36（新版 Flutter 用 .kts）
          sed -i 's|minSdk = .*|minSdk = 24|' android/app/build.gradle.kts
          sed -i 's|compileSdk = .*|compileSdk = 36|' android/app/build.gradle.kts
          # 设置应用名称为中文
          sed -i 's/android:label="simple_dictation"/android:label="简易听写"/' android/app/src/main/AndroidManifest.xml
          grep -n 'minSdk\|compileSdk' android/app/build.gradle.kts
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: 代码静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 重命名 APK（带版本号）
        run: |
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          NEW_NAME="simple_dictation_v${VERSION}_$(date +%Y%m%d).apk"
          cp "$APK_PATH" "build/app/outputs/flutter-apk/$NEW_NAME"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: simple-dictation-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
