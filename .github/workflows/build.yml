name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter info
        run: flutter --version

      - name: Install deps
        run: flutter pub get

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=simple_dictation
          rm -rf test

      - name: Patch Android config
        run: |
          sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/android:label="simple_dictation"/android:label="简易听写"/' android/app/src/main/AndroidManifest.xml
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          # Android 11+ 包可见性：必须声明 queries 才能查询/绑定 TTS 引擎
          python3 - << 'PYEOF'
          man = "android/app/src/main/AndroidManifest.xml"
          with open(man, "r", encoding="utf-8") as f:
              content = f.read()
          queries = '''<queries>
              <intent>
                  <action android:name="android.intent.action.TTS_SERVICE" />
              </intent>
              <package android:name="com.google.android.tts" />
          </queries>
          '''
          if "<queries>" not in content:
              content = content.replace("</manifest>", queries + "</manifest>")
          with open(man, "w", encoding="utf-8") as f:
              f.write(content)
          print("queries injected")
          PYEOF
          grep -n "queries\|TTS_SERVICE\|com.google.android.tts" android/app/src/main/AndroidManifest.xml
          # 强制所有插件模块用 compileSdk 36（必须放在 build.gradle.kts 开头）
          printf 'subprojects {\n    afterEvaluate {\n        val a = extensions.findByName("android")\n        if (a is com.android.build.gradle.LibraryExtension) {\n            a.compileSdk = 36\n        }\n    }\n}\n' > android/build.gradle.kts.tmp
          cat android/build.gradle.kts >> android/build.gradle.kts.tmp
          mv android/build.gradle.kts.tmp android/build.gradle.kts
          echo "=== app build.gradle.kts ==="
          grep -n 'minSdk\|compileSdk' android/app/build.gradle.kts

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-dictation-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
