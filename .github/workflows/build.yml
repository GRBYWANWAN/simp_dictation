name: Build Android APK

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: 打印 Flutter 版本和诊断
        run: |
          flutter --version
          flutter doctor -v

      - name: 接受 Android SDK 许可
        run: yes | flutter doctor --android-licenses || true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成标准 Android 工程
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=simple_dictation
          # 删除自动生成的测试文件（引用了不存在的 MyApp 类）
          rm -rf test
          # 升级 Kotlin 和 AGP 版本（flutter_tts 需要新版 Kotlin）
          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.0.20"|' android/settings.gradle
          sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.3.0"|' android/settings.gradle
          # 升级 Gradle Wrapper 到 8.4+（AGP 8.3 要求）
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # flutter_tts 要求 minSdkVersion 24
          echo "=== 修改前 build.gradle.kts ==="
          cat android/app/build.gradle.kts 2>/dev/null || echo "(不存在)"
          echo "=== 修改前 build.gradle ==="
          cat android/app/build.gradle 2>/dev/null || echo "(不存在)"
          # 兼容 Kotlin DSL (minSdk = ...) 和 Groovy (minSdkVersion ...) 两种写法
          sed -i 's|minSdk = .*|minSdk = 24|' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's|minSdkVersion .*|minSdkVersion 24|' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's|minSdkVersion .*|minSdkVersion 24|' android/app/build.gradle 2>/dev/null || true
          echo "=== 修改后 ==="
          grep -rn 'minSdk' android/app/
          # 设置应用名称为中文
          sed -i 's/android:label="sample"/android:label="简易听写"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: 代码静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 重命名 APK（带版本号）
        run: |
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          NEW_NAME="simple_dictation_v${VERSION}_$(date +%Y%m%d).apk"
          cp "$APK_PATH" "build/app/outputs/flutter-apk/$NEW_NAME"
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: simple-dictation-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
